[build-system]
# v77 needed for SPDX `license` expressions (PEP 639)
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "minchinweb.scripts.qbw-to-sqlite"
description = "Convert QuickBooks Desktop .QBW and .QBB company files to SQLite."
dynamic = ["version", "readme"]
authors = [{ name = "William Minchin" }]
maintainers = [{ name = "William Minchin" }]
# Oldest Python supported. CI tests 3.9 and 3.15; versions in between are best
# effort. Set by minchin.tasks (dev tooling), which needs 3.9 or newer.
requires-python = ">=3.9"
keywords = ["quickbooks", "sqlite", "sql anywhere", "qbw", "qbb", "accounting"]
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
  # having an unknown classifier should keep PyPI from accepting the
  # package as an upload
  # 'Private :: Do Not Upload',
  # 'Development Status :: 1 - Planning',
  # 'Development Status :: 2 - Pre-Alpha',
  # 'Development Status :: 3 - Alpha',
  "Development Status :: 4 - Beta",
  # 'Development Status :: 5 - Production/Stable',
  # 'Development Status :: 6 - Mature',
  # 'Development Status :: 7 - Inactive',
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  # "Programming Language :: Python :: 3.10",
  # "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Database",
  "Topic :: Office/Business :: Financial :: Accounting",
  # full list at https://pypi.org/classifiers/
]
# Direct (top-level) requirements only, with a minimum version. Exact versions
# of everything, direct and indirect, live in `uv.lock`. Empty: the core is
# standard library only.
dependencies = []

[project.optional-dependencies]
# Used only by the experimental `openqbw` backend.
openqbw = ["openqbw >= 0.2.0; python_version >= '3.10'"]

[project.scripts]
qbw-to-sqlite = "minchinweb.scripts.qbw_to_sqlite.cli:main"

[project.urls]
# P6 asks for these. Add them once the repository has a home:
# "Bug Tracker" = "..."
# Repository = "..."
# Changelog = "..."

[dependency-groups]
# PEP 735; not published. `uv sync` installs `dev` by default.
dev = [
  "invoke >= 2.2",
  "minchin.tasks >= 1.1",        # brings taplo and validate-pyproject
  "pytest >= 8",
  "ruff >= 0.14",
  { include-group = "release" },
]
release = ["minchin.releaser >= 0.9.6"]

[tool.setuptools.packages.find]
# flat layout; tests live in the package (`minchinweb/scripts/qbw_to_sqlite/tests/`).
# `minchinweb` and `minchinweb.scripts` are implicit (PEP 420) namespace
# packages, so they have NO `__init__.py`.
include = ["minchinweb*"]
exclude = [
  # top-level only; `minchinweb.<...>.tests` ships with the package
  "build",
  "dist",
  "docs",
  "env",
  "test",
  "tests",
  "output",
  "qb-sandbox",
]

[tool.setuptools.dynamic]
# the place the version is located via static analysis (a plain string literal)
version = { attr = "minchinweb.scripts.qbw_to_sqlite._version.__version__" }
readme = { file = ["README.rst"], content-type = "text/x-rst" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
# tests ship inside the package
testpaths = ["minchinweb"]

[tool.ruff]
line-length = 88
# also skip excluded paths when a path is given explicitly
force-exclude = true
# Generated code
extend-exclude = ["_build", "**/migrations/*.py"]

[tool.ruff.format]
# Reformat code snippets in docstrings.
docstring-code-format = true
# Keep each file's existing line endings, so Windows (CRLF working tree) and
# the Linux CI runner don't fight each other.
line-ending = "auto"

[tool.ruff.lint]
# Enable `from __future__ import annotations` imports
future-annotations = true
# `CPY001` is preview-only. `explicit-preview-rules` limits preview to rules
# selected by their full code, so no other rule changes behaviour.
preview = true
explicit-preview-rules = true
# Added to ruff's default (E4, E7, E9, F)
extend-select = [
  "A",      # shadowing builtin names
  "B",      # bugbear
  "CPY001", # copyright notice at the top of each file
  "E",
  "W",      # pycodestyle
  "I",      # isort
  "N",      # PEP8 naming
  "PTH",    # use pathlib
  "RUF",    # ruff-specific
  "SIM",    # simplify
  "UP",     # pyupgrade (limited by `requires-python`)
  "YTT",    # flake8-2020 (common issues with Python version checks)
]

# Rules turned off on purpose (keep each with a reason; see STYLE.md F3)
ignore = [
  "SIM108", # prefer a plain if/else block over a ternary (reads better)
]

[tool.ruff.lint.flake8-copyright]
# `notice-rgx` is ruff's default, written out. A notice looks like
# `Copyright (c) 2026 Name`.
notice-rgx = "(?i)Copyright\\s+((?:\\(C\\)|©)\\s+)?\\d{4}((-|,\\s)\\d{4})*"
author = "William Minchin"
# Bytes. Skips empty and import-only `__init__.py` files.
min-file-size = 1024

[tool.ruff.lint.isort]
# Sort imports within their section independent of the import type
force-sort-within-sections = true
known-first-party = ["minchinweb"]
# Rule I002; `--fix` adds it. Empty files are skipped.
required-imports = ["from __future__ import annotations"]
# Framework sections are standard boilerplate; an unused one costs nothing.
section-order = [
  "future",
  "standard-library",
  "django",
  "pelican",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"pelican" = ["pelican"]
