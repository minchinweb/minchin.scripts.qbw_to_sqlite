[build-system]
# v77 needed for SPDX `license` expressions (PEP 639)
requires = ["setuptools >= 77"]
build-backend = "setuptools.build_meta"

[project]
name = "minchin.scripts.qbw-to-sqlite"
description = "Convert QuickBooks Desktop .QBW and .QBB company files to SQLite."
dynamic = ["version", "readme"]
authors = [{ name = "William Minchin" }]
maintainers = [{ name = "William Minchin" }]
requires-python = ">=3.9"
keywords = ["quickbooks", "sqlite", "sql anywhere", "qbw", "qbb", "accounting"]
license = "MIT"
license-files = ["LICEN[CS]E*"]
classifiers = [
  # 'Development Status :: 1 - Planning',
  # 'Development Status :: 2 - Pre-Alpha',
  # 'Development Status :: 3 - Alpha',
  "Development Status :: 4 - Beta",
  # 'Development Status :: 5 - Production/Stable',
  # 'Development Status :: 6 - Mature',
  # 'Development Status :: 7 - Inactive',
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Natural Language :: English",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Database",
  "Topic :: Office/Business :: Financial :: Accounting",
  # full list at https://pypi.org/classifiers/
]
dependencies = [
  "colorama >= 0.4.6",     # turns on colour codes in the Windows console
  "minchin.text >= 7.0.0", # CLI title, subtitle and right-aligned clock
]

[project.optional-dependencies]
openqbw = ["openqbw >= 0.2.0; python_version >= '3.10'"]

[project.scripts]
qbw2sqlite = "minchin.scripts.qbw_to_sqlite.cli:main"

[project.urls]
"Bug Tracker" = "https://github.com/minchinweb/minchin.scripts.qbw_to_sqlite/issues"
"Repository" = "https://github.com/minchinweb/minchin.scripts.qbw_to_sqlite"
"Changelog" = "https://github.com/minchinweb/minchin.scripts.qbw_to_sqlite/blob/master/CHANGELOG.rst"

[dependency-groups]
dev = [
  "invoke >= 2.2",
  "minchin.tasks >= 1.1",        # brings taplo and validate-pyproject
  "pytest >= 8",
  "ruff >= 0.14",
  { include-group = "release" },
]
release = ["minchin.releaser >= 0.9.6"]

[tool.setuptools.packages.find]
include = ["minchin*"]
exclude = [
  # top-level only; `minchin.<...>.tests` ships with the package
  "build",
  "dist",
  "docs",
  "env",
  "test",
  "tests",
  "output",
  "qb-sandbox",
]

[tool.setuptools.dynamic]
version = { attr = "minchin.scripts.qbw_to_sqlite._version.__version__" }
readme = { file = ["README.rst"], content-type = "text/x-rst" }

[tool.pytest.ini_options]
# `-rs` lists each skipped test with its reason in the summary.
addopts = "-rs"
# Not `--import-mode=importlib`: it shadows the shared `minchin` namespace
# (minchin-text, minchin-tasks, ...), so `minchin.text` stops resolving.
# tests ship inside the package
testpaths = ["minchin"]

[tool.ruff]
line-length = 88
force-exclude = true
extend-exclude = ["_build", "**/migrations/*.py"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "auto"

[tool.ruff.lint]
future-annotations = true
preview = true
explicit-preview-rules = true
extend-select = [
  "A",      # shadowing builtin names
  "B",      # bugbear
  "CPY001", # copyright notice at the top of each file
  "E",
  "W",      # pycodestyle
  "I",      # isort
  "N",      # PEP8 naming
  "PTH",    # use pathlib
  "RUF",    # ruff-specific
  "SIM",    # simplify
  "UP",     # pyupgrade (limited by `requires-python`)
  "YTT",    # flake8-2020 (common issues with Python version checks)
]

ignore = [
  "SIM108", # prefer a plain if/else block over a ternary (reads better)
]

[tool.ruff.lint.flake8-copyright]
# `notice-rgx` is ruff's default, written out. A notice looks like
# `Copyright (c) 2026 Name`.
notice-rgx = "(?i)Copyright\\s+((?:\\(C\\)|©)\\s+)?\\d{4}((-|,\\s)\\d{4})*"
author = "William Minchin"
# Bytes. Skips empty and import-only `__init__.py` files.
min-file-size = 1024

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["minchin"]
required-imports = ["from __future__ import annotations"]
section-order = [
  "future",
  "standard-library",
  "django",
  "pelican",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.isort.sections]
"django" = ["django"]
"pelican" = ["pelican"]
